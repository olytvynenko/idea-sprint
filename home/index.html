<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>Idea Sprint</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f7f7f6; color: #1a1a18;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .wrap { width: 100%; max-width: 480px; padding: 24px; }
    h1 { font-size: 15px; font-weight: 600; color: #6b6b67; margin-bottom: 16px; letter-spacing: 0.04em; text-transform: uppercase; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    a {
      display: flex; align-items: center; justify-content: space-between;
      background: #fff; border: 1px solid #e4e3df; border-radius: 10px;
      padding: 16px 18px; text-decoration: none; color: #1a1a18;
      transition: border-color 0.15s;
    }
    a:hover { border-color: #aaa9a4; }
    .name { font-size: 15px; font-weight: 500; }
    .desc { font-size: 12px; color: #9b9b96; margin-top: 2px; }
    .port { font-size: 12px; color: #c0bfbb; font-variant-numeric: tabular-nums; }
    .arrow { color: #c0bfbb; font-size: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Idea Sprint</h1>
    <div class="list" id="list"></div>
  </div>
  <script>
    const apps = [
      { name: 'Ideas Dashboard', desc: 'Current ideas · calendar of past runs', port: 4001, url: 'http://localhost:4001' },
    ]
    const list = document.getElementById('list')
    apps.forEach(app => {
      const a = document.createElement('a')
      a.href = app.url
      a.innerHTML = `
        <div>
          <div class="name">${app.name}</div>
          <div class="desc">${app.desc}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="port">:${app.port}</span>
          <span class="arrow">→</span>
        </div>`
      list.appendChild(a)
    })
  </script>
</body>
</html>
